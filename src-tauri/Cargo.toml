[package]
name = "magpie-hud"
version = "1.0.17"
description = "只读监视 Magpie 路由结果的桌面悬浮窗"
authors = ["smallcat_SY"]
edition = "2021"

[lib]
name = "magpie_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
notify = "8"
ureq = { version = "3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader"] }
